<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Fleming Analytic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 1px solid #0f3460;
        }
        header h1 {
            font-size: 1.5rem;
            color: #e94560;
        }
        header p {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.25rem;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 1rem;
            min-height: 400px;
            max-height: 60vh;
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            max-width: 85%;
        }
        .message.user {
            background: #0f3460;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        .message.assistant {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-bottom-left-radius: 2px;
        }
        .message pre {
            background: #0d0d1a;
            padding: 0.5rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .message code {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9em;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
        }
        textarea {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #16213e;
            color: #eee;
            font-size: 1rem;
            resize: none;
            min-height: 60px;
        }
        textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #d63850;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.85rem;
            color: #888;
        }
        .status.error {
            color: #e94560;
        }
        .typing {
            display: inline-block;
            padding: 0.5rem;
        }
        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .settings {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #16213e;
            border-radius: 8px;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .settings label {
            font-size: 0.85rem;
            color: #888;
        }
        .settings input, .settings select {
            padding: 0.4rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.85rem;
        }
        .stats {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #0f3460;
        }
        .apps-panel {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #16213e;
            border-radius: 8px;
        }
        .apps-panel h3 {
            font-size: 0.9rem;
            color: #e94560;
            margin-bottom: 0.5rem;
        }
        .apps-panel p {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
        .app-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .app-chip {
            padding: 0.4rem 0.8rem;
            background: #0f3460;
            border: 1px solid #1a3a6e;
            border-radius: 16px;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }
        .app-chip:hover {
            background: #1a3a6e;
            border-color: #e94560;
            color: #fff;
        }
        .app-chip.loading {
            opacity: 0.6;
            cursor: wait;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chat</h1>
        <p>Powered by Llama 3.2 (1B) running locally</p>
    </header>

    <div class="container">
        <div class="apps-panel">
            <h3>Explore Apps</h3>
            <p>Click an app to have the AI explain what it does:</p>
            <div class="app-chips" id="appChips">
                <span class="app-chip" style="opacity: 0.5;">Loading apps...</span>
            </div>
        </div>

        <div class="settings">
            <label>
                System prompt:
                <input type="text" id="system" placeholder="Optional context..." style="width: 300px;">
            </label>
            <label>
                Temperature:
                <input type="number" id="temperature" value="0.7" min="0" max="1" step="0.1" style="width: 60px;">
            </label>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message assistant">
                Hello! I'm a local AI assistant. How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <textarea id="prompt" placeholder="Type your message..." rows="2"></textarea>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');
        const systemInput = document.getElementById('system');
        const tempInput = document.getElementById('temperature');

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(content, role, stats = null) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            let html = formatMessage(content);
            if (stats && stats.tokens_per_second) {
                html += `<div class="stats">${stats.tokens} tokens | ${stats.tokens_per_second} tok/s | ${(stats.eval_duration_ms / 1000).toFixed(1)}s</div>`;
            }
            div.innerHTML = html;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function formatMessage(text) {
            // Basic markdown-like formatting
            return text
                .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typing';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user');
            promptInput.value = '';
            sendBtn.disabled = true;
            statusEl.textContent = '';
            showTyping();

            try {
                const response = await fetch('/chat/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        system: systemInput.value || null,
                        temperature: parseFloat(tempInput.value) || 0.7
                    })
                });

                hideTyping();

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Request failed');
                }

                const data = await response.json();
                addMessage(data.response, 'assistant', {
                    tokens: data.tokens,
                    tokens_per_second: data.tokens_per_second,
                    eval_duration_ms: data.eval_duration_ms
                });

            } catch (error) {
                hideTyping();
                statusEl.className = 'status error';
                statusEl.textContent = error.message;
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        // Check health on load
        fetch('/chat/health')
            .then(r => r.json())
            .then(data => {
                if (data.status !== 'healthy') {
                    statusEl.className = 'status error';
                    statusEl.textContent = 'Warning: LLM service may be unavailable';
                }
            });

        // Load available apps
        async function loadApps() {
            const chipsContainer = document.getElementById('appChips');
            try {
                const response = await fetch('/chat/apps');
                const data = await response.json();

                chipsContainer.innerHTML = '';
                data.apps.forEach(app => {
                    const chip = document.createElement('span');
                    chip.className = 'app-chip';
                    chip.textContent = app.name;
                    chip.title = app.description;
                    chip.onclick = () => explainApp(app.name, chip);
                    chipsContainer.appendChild(chip);
                });
            } catch (error) {
                chipsContainer.innerHTML = '<span style="color: #e94560; font-size: 0.8rem;">Could not load apps</span>';
            }
        }

        // Explain an app using the LLM
        async function explainApp(appName, chipEl) {
            if (chipEl.classList.contains('loading')) return;

            // Show user message
            addMessage(`Explain what the "${appName}" app does`, 'user');

            // Mark chip as loading
            chipEl.classList.add('loading');
            showTyping();
            statusEl.textContent = `Analyzing ${appName} code...`;

            try {
                const response = await fetch(`/chat/explain/${appName}`);
                hideTyping();

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Request failed');
                }

                const data = await response.json();

                // Format the explanation nicely
                let content = data.explanation;
                if (data.endpoints && data.endpoints.length > 0) {
                    content += `\n\n**Endpoints:**\n${data.endpoints.map(e => '• ' + e).join('\n')}`;
                }

                addMessage(content, 'assistant', {
                    tokens: data.tokens,
                    tokens_per_second: data.tokens_per_second,
                    eval_duration_ms: data.tokens ? (data.tokens / data.tokens_per_second * 1000) : null
                });

                statusEl.textContent = '';
            } catch (error) {
                hideTyping();
                statusEl.className = 'status error';
                statusEl.textContent = error.message;
            } finally {
                chipEl.classList.remove('loading');
            }
        }

        // Load apps on page load
        loadApps();
    </script>
</body>
</html>
