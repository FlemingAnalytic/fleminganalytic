{% extends "base.html" %}

{% block title %}{% if event %}Edit{% else %}New{% endif %} Event{% endblock %}
{% block page_title %}{% if event %}Edit{% else %}New{% endif %} Event{% endblock %}

{% block content %}
<div class="card">
    <form method="POST" action="/stjohn/admin/events/{% if event %}{{ event.id }}/edit{% else %}new{% endif %}">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" class="form-control"
                   value="{{ event.title if event else '' }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description (HTML Content)</label>
            <textarea id="description" name="description" class="form-control wysiwyg">{{ event.description if event else '' }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-control">
                    <option value="event" {% if event and event.category == 'event' %}selected{% endif %}>Event</option>
                    <option value="signup" {% if event and event.category == 'signup' %}selected{% endif %}>Sign Up</option>
                    <option value="recurring" {% if event and event.category == 'recurring' %}selected{% endif %}>Recurring</option>
                    <option value="announcement" {% if event and event.category == 'announcement' %}selected{% endif %}>Announcement</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sort_order">Sort Order</label>
                <input type="number" id="sort_order" name="sort_order" class="form-control"
                       value="{{ event.sort_order if event else 0 }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="event_date">Event Date</label>
                <input type="date" id="event_date" name="event_date" class="form-control"
                       value="{{ event.event_date.strftime('%Y-%m-%d') if event and event.event_date else '' }}">
            </div>

            <div class="form-group">
                <label for="event_time">Event Time</label>
                <input type="text" id="event_time" name="event_time" class="form-control"
                       value="{{ event.event_time if event else '' }}" placeholder="9:00 AM - 12:00 PM">
            </div>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" class="form-control"
                   value="{{ event.location if event else '' }}" placeholder="Fellowship Hall">
        </div>

        <div class="form-group">
            <label for="image_url">Image URL</label>
            <div style="display: flex; gap: 0.5rem;">
                <input type="url" id="image_url" name="image_url" class="form-control"
                       value="{{ event.image_url if event else '' }}"
                       placeholder="https://static.wixstatic.com/...">
                <button type="button" class="btn btn-secondary" onclick="openUploadModal('image_url')">Upload</button>
            </div>
            <small style="color: #6b7280;">Use Wix images or upload your own</small>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="signup_url">Sign Up URL</label>
                <input type="url" id="signup_url" name="signup_url" class="form-control"
                       value="{{ event.signup_url if event else '' }}"
                       placeholder="https://signupgenius.com/...">
            </div>

            <div class="form-group">
                <label for="details_url">Details/More Info URL</label>
                <input type="url" id="details_url" name="details_url" class="form-control"
                       value="{{ event.details_url if event else '' }}">
            </div>
        </div>

        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" id="is_featured" name="is_featured" value="true"
                       {% if event and event.is_featured %}checked{% endif %}>
                <label for="is_featured">Featured (show prominently)</label>
            </div>
        </div>

        {% if event %}
        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" id="is_active" name="is_active" value="true"
                       {% if event.is_active %}checked{% endif %}>
                <label for="is_active">Active (visible on site)</label>
            </div>
        </div>
        {% endif %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if event %}Update{% else %}Create{% endif %} Event
            </button>
            <a href="/stjohn/admin/events" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
